<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b18">
<title>NEON DODGE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none}
#game{display:block;width:100%;height:100%;background:#080b18}
.ui{position:absolute;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:18px 20px;font-weight:800;letter-spacing:1px;text-shadow:0 0 12px #00e5ff}
.score{font-size:25px}.best{font-size:12px;color:#9aa8ca;margin-top:4px;text-align:right}
.brand{font-size:15px;color:#b9c8ff}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;max-width:360px;text-align:center;pointer-events:auto}
h1{font-size:42px;line-height:.95;margin:0 0 12px;letter-spacing:2px;color:#fff;text-shadow:0 0 24px #00d9ff}
.sub{color:#aab8d8;font-size:14px;line-height:1.6;margin:14px 0 24px}
button{border:0;border-radius:14px;padding:15px 26px;font-size:16px;font-weight:800;color:#06101b;background:linear-gradient(135deg,#00e5ff,#78ffcf);box-shadow:0 8px 25px #00d9ff33;cursor:pointer}
small{display:block;color:#6f7e9f;margin-top:18px;font-size:11px;letter-spacing:1px}
.hidden{display:none}
#pause{position:absolute;right:16px;top:75px;pointer-events:auto;background:#18223a;color:#dce7ff;padding:9px 12px;border-radius:10px;font-size:12px}
#hint{position:absolute;bottom:24px;width:100%;text-align:center;color:#64749a;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
 <div class="top"><div><div class="brand">⚡ NEON DODGE</div><div class="score" id="score">0000</div></div><div><div class="best" id="best">BEST 0000</div></div></div>
 <button id="pause" class="hidden">Ⅱ PAUSE</button>
 <div class="center" id="intro"><h1>NEON<br>DODGE</h1><div class="sub">Dodge the red blocks.<br>Collect cyan energy. Survive as long as you can.</div><button id="start">START GAME ▶</button><small>SWIPE LEFT / RIGHT • TAP TO DASH</small></div>
 <div class="center hidden" id="over"><h1>GAME OVER</h1><div class="sub" id="result">Score: 0</div><button id="again">PLAY AGAIN ↻</button><small>ONE MORE RUN?</small></div>
 <div class="center hidden" id="paused"><h1>PAUSED</h1><div class="sub">Catch your breath.</div><button id="resume">RESUME ▶</button></div>
 <div id="hint">Swipe to move • Tap to dash</div>
</div>
<script>
(function(){
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=0,H=0,dpr=1,player,obstacles=[],coins=[],particles=[],running=false,paused=false,dead=false;
var score=0,best=0,speed=230,spawn=0,coinSpawn=0,last=0,dash=0,lane=1,targetLane=1;
var lanes=[0,0,0],laneX=[],touchX=0,touchY=0;
try{best=+(localStorage.getItem('neondodgebest')||0)}catch(e){}
document.getElementById('best').textContent='BEST '+pad(best);
function pad(n){return ('0000'+Math.floor(n)).slice(-4)}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);laneX=[W*.22,W*.5,W*.78];}
window.addEventListener('resize',resize);resize();
function reset(){score=0;speed=230;spawn=.6;coinSpawn=1.1;obstacles=[];coins=[];particles=[];lane=1;targetLane=1;dash=0;player={x:laneX[1],y:H*.78,r:13};dead=false;document.getElementById('score').textContent='0000';}
function start(){reset();running=true;paused=false;last=performance.now();hide('intro');hide('over');hide('paused');show('pause');requestAnimationFrame(loop);}
function show(id){document.getElementById(id).classList.remove('hidden')}function hide(id){document.getElementById(id).classList.add('hidden')}
function move(dir){targetLane=Math.max(0,Math.min(2,targetLane+dir));}
function dashNow(){if(running&&!paused&&!dead){dash=.25;burst(player.x,player.y,'#6fffe0',12)}}
canvas.addEventListener('touchstart',function(e){e.preventDefault();touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();if(!running||paused)return;var dx=(e.changedTouches[0].clientX-touchX),dy=(e.changedTouches[0].clientY-touchY);if(Math.abs(dx)>24)move(dx>0?1:-1);else if(Math.abs(dy)>30)move(dy>0?1:-1);else dashNow();},{passive:false});
canvas.addEventListener('mousedown',function(e){touchX=e.clientX;});
canvas.addEventListener('mouseup',function(e){if(!running||paused)return;var dx=e.clientX-touchX;if(Math.abs(dx)>25)move(dx>0?1:-1);else dashNow();});
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
document.getElementById('pause').onclick=function(){if(!running)return;paused=true;show('paused');hide('pause')};
document.getElementById('resume').onclick=function(){paused=false;hide('paused');show('pause');last=performance.now();requestAnimationFrame(loop)};
function burst(x,y,color,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=40+Math.random()*190;particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.35,color:color})}}
function spawnBlock(){var l=Math.floor(Math.random()*3);obstacles.push({lane:l,y:-35,w:W*.12,h:26+Math.random()*22,kind:Math.random()<.22?'wide':'normal'});if(Math.random()<.23){var l2=(l+1+Math.floor(Math.random()*2))%3;obstacles.push({lane:l2,y:-105,w:W*.11,h:28,kind:'normal'})}}
function spawnCoin(){coins.push({lane:Math.floor(Math.random()*3),y:-25,r:8})}
function end(){running=false;dead=true;burst(player.x,player.y,'#ff416c',30);if(score>best){best=score;try{localStorage.setItem('neondodgebest',best)}catch(e){}document.getElementById('best').textContent='BEST '+pad(best)}
document.getElementById('result').textContent='Score: '+score+'  •  Best: '+best;hide('pause');show('over')}
function loop(now){if(!running||paused)return;var dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){speed+=dt*5;score+=Math.floor(dt*10);document.getElementById('score').textContent=pad(score);
player.x+=(laneX[targetLane]-player.x)*Math.min(1,dt*14);lane=targetLane;
spawn-=dt;if(spawn<=0){spawn=Math.max(.38,1.0-speed/600)+(Math.random()*.25);spawnBlock()}
coinSpawn-=dt;if(coinSpawn<=0){coinSpawn=1.0+Math.random()*1.1;spawnCoin()}
for(var i=obstacles.length-1;i>=0;i--){var o=obstacles[i];o.y+=speed*dt;var ox=laneX[o.lane],hitY=Math.abs(o.y+o.h/2-player.y)<player.r+o.h/2;var hitX=Math.abs(ox-player.x)<player.r+o.w/2;if(hitY&&hitX&&dash<=0){end();return}if(o.y>H+50)obstacles.splice(i,1)}
for(var j=coins.length-1;j>=0;j--){var c=coins[j];c.y+=speed*dt;if(Math.abs(c.y-player.y)<20&&Math.abs(laneX[c.lane]-player.x)<24){score+=50;burst(laneX[c.lane],c.y,'#00e5ff',8);coins.splice(j,1)}else if(c.y>H+20)coins.splice(j,1)}
if(dash>0)dash-=dt;
for(var p=particles.length-1;p>=0;p--){var q=particles[p];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=100*dt;q.life-=dt;if(q.life<=0)particles.splice(p,1)}
}
function draw(){ctx.clearRect(0,0,W,H);
var grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#080b18');grd.addColorStop(1,'#111a35');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#1b2b4b';ctx.lineWidth=1;for(var l=0;l<3;l++){ctx.beginPath();ctx.moveTo(laneX[l],0);ctx.lineTo(laneX[l],H);ctx.stroke()}
for(var y=(Date.now()/8)%48;y<H;y+=48){ctx.strokeStyle='#14213a';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
coins.forEach(function(c){ctx.shadowBlur=18;ctx.shadowColor='#00e5ff';ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(laneX[c.lane],c.y,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
obstacles.forEach(function(o){var x=laneX[o.lane];ctx.shadowBlur=15;ctx.shadowColor='#ff315f';ctx.fillStyle='#ff315f';roundRect(x-o.w/2,o.y,o.w,o.h,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ff9bb3';ctx.fillRect(x-o.w/2+5,o.y+4,o.w-10,3)});
particles.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1});
if(player){ctx.shadowBlur=dash>0?28:18;ctx.shadowColor=dash>0?'#fff':'#6fffe0';ctx.fillStyle=dash>0?'#fff':'#6fffe0';ctx.beginPath();ctx.arc(player.x,player.y,player.r+(dash>0?5:0),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#08202a';ctx.beginPath();ctx.arc(player.x,player.y,5,0,Math.PI*2);ctx.fill()}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
draw();
})();
</script>
</body></html>
